<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Demo — Spring Boot Clean Architecture</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-slate-50 text-slate-900">
<main class="mx-auto max-w-xl px-6 py-16">
    <h1 class="text-2xl font-semibold">Clean Architecture Skeleton</h1>
    <p class="mt-2 text-slate-600">
        Java 25 &middot; Spring Boot 4.0.1 &middot; MySQL + Redis &middot; Thymeleaf + Tailwind CSS + HTMX
    </p>

    <button
            class="mt-8 rounded-md bg-slate-900 px-4 py-2 text-white hover:bg-slate-700"
            hx-get="/ping"
            hx-target="#pong-target"
            hx-swap="innerHTML">
        Ping
    </button>

    <div id="pong-target" class="mt-4 text-slate-600"></div>
</main>
</body>
</html>
