spring.thymeleaf.cache=true

app.datasource.primary.url=${DB_PRIMARY_URL}
app.datasource.primary.username=${DB_PRIMARY_USERNAME}
app.datasource.primary.password=${DB_PRIMARY_PASSWORD}

app.datasource.replicas[0].key=replica-1
app.datasource.replicas[0].url=${DB_REPLICA_URL}
app.datasource.replicas[0].username=${DB_REPLICA_USERNAME}
app.datasource.replicas[0].password=${DB_REPLICA_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.from=${MAIL_FROM}
