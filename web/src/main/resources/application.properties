spring.application.name=thanhnd-demo-claude
server.port=8080

spring.profiles.active=@spring.profiles.active@

spring.thymeleaf.cache=true

management.endpoints.web.exposure.include=health,info

datasource.replica.health-check-interval-ms=30000
datasource.replica.failover-cooldown-seconds=60
datasource.replica.max-consecutive-failures=3
