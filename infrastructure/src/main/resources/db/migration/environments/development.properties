####
#   development.properties
#
#   MyBatis Migrations environment config. Values sourced from env vars so the
#   same repository works against docker-compose's mysql-primary service.
####

time_zone=UTC
delimiter=;
full_line_delimiter=false
send_full_script=false
auto_commit=false
ignore_extension=false

driver=com.mysql.cj.jdbc.Driver
url=jdbc:mysql://localhost:3316/demo
username=demo
password=123456789

changelog=CHANGELOG
