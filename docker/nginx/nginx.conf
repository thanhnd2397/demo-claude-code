server {
    listen 80;

    # Docker's embedded DNS server. Resolving the upstream at request time (via a
    # variable in proxy_pass) instead of at startup keeps nginx bootable while the
    # app container is down, and picks up its new IP after a restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
